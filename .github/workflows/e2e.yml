name: E2E tests

# Сквозные проверки на настоящем сервере с временными тестовыми аккаунтами.
on:
  push:
    branches: [main]
    paths: ['tests/**', '.github/workflows/e2e.yml']
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      SB: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keys
        run: |
          curl -s -H "Authorization: Bearer $SB" "https://api.supabase.com/v1/projects/pjjeypdxwnbtyqabhroi/api-keys?reveal=true" > keys.json
          echo "::notice title=keys::$(python3 -c "import json;k=json.load(open('keys.json'));print([ (x.get('name'), x.get('type'), len(x.get('api_key') or '')) for x in k] if isinstance(k,list) else str(k)[:200])")"
          ANON=$(python3 -c "import json;k=json.load(open('keys.json'));print(next(x['api_key'] for x in k if x['name']=='anon'))")
          SERVICE=$(python3 -c "import json;k=json.load(open('keys.json'));print(next(x['api_key'] for x in k if x['name']=='service_role'))")
          rm keys.json
          echo "::add-mask::$ANON"; echo "::add-mask::$SERVICE"
          echo "ANON=$ANON" >> "$GITHUB_ENV"; echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
      - name: Install
        run: |
          cd tests && npm init -y >/dev/null
          npm i @supabase/supabase-js@2 > npm.txt 2>&1 || { echo "::error title=npm::$(tail -15 npm.txt | tr '\n' ' ')"; exit 1; }
      - name: Run
        shell: bash
        run: |
          set +e
          node tests/e2e.mjs > out.txt 2>&1
          code=$?
          cat out.txt
          grep -q '^::' out.txt || echo "::error title=crash::$(tail -25 out.txt | tr '\n' ' ' | head -c 3000)"
          exit $code
