name: Supabase functions

# Публикует серверные функции (бот проверки, оплата, письма) и передаёт им ключи.
# Нужен секрет репозитория SUPABASE_ACCESS_TOKEN. Остальные ключи — по мере подключения сервисов.
on:
  push:
    paths: ['supabase/functions/**', 'supabase/templates/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: pjjeypdxwnbtyqabhroi
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_CHANNEL_ID: '@svoi_egypt'
      PAYMOB_SECRET_KEY: ${{ secrets.PAYMOB_SECRET_KEY }}
      PAYMOB_PUBLIC_KEY: ${{ secrets.PAYMOB_PUBLIC_KEY }}
      PAYMOB_INTEGRATION_IDS: ${{ secrets.PAYMOB_INTEGRATION_IDS }}
      PAYMOB_HMAC: ${{ secrets.PAYMOB_HMAC }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check functions
        run: deno check supabase/functions/*/index.ts

      - name: Check token
        id: chk
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
          elif [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Добавьте секрет SUPABASE_ACCESS_TOKEN (Settings → Secrets → Actions), чтобы публиковать функции."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Supabase CLI
        if: steps.chk.outputs.ok == '1'
        run: |
          npm i -g supabase > npm.txt 2>&1 || { echo "::error title=cli::$(tail -5 npm.txt | tr '\n' ' ')"; exit 1; }
          supabase --version

      - name: Set function secrets
        if: steps.chk.outputs.ok == '1'
        run: |
          for k in TELEGRAM_BOT_TOKEN TELEGRAM_ADMIN_CHAT_ID TELEGRAM_CHANNEL_ID PAYMOB_SECRET_KEY PAYMOB_PUBLIC_KEY PAYMOB_INTEGRATION_IDS PAYMOB_HMAC RESEND_API_KEY MAIL_FROM; do
            v="${!k}"
            if [ -n "$v" ]; then
              if out=$(supabase secrets set --yes --project-ref "$PROJECT" "$k=$v" 2>&1); then echo "set $k"
              else echo "::error title=secrets $k::$(echo "$out" | tail -5 | tr '\n' ' ')"; exit 1; fi
            fi
          done

      - name: Auth email via Resend SMTP
        if: steps.chk.outputs.ok == '1' && env.RESEND_API_KEY != ''
        run: |
          body=$(jq -n --arg pass "$RESEND_API_KEY" --rawfile conf supabase/templates/confirm.html --rawfile rec supabase/templates/recovery.html \
            '{smtp_admin_email:"noreply@svoi-egypt.com", smtp_sender_name:"Свои в Египте", smtp_host:"smtp.resend.com", smtp_port:"465", smtp_user:"resend", smtp_pass:$pass, rate_limit_email_sent:100,
              mailer_otp_length:6, mailer_otp_exp:3600,
              mailer_subjects_confirmation:"Код подтверждения — Свои в Египте", mailer_templates_confirmation_content:$conf,
              mailer_subjects_recovery:"Сброс пароля — Свои в Египте", mailer_templates_recovery_content:$rec}')
          code=$(curl -s -o out.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT/config/auth" -d "$body")
          if [ "$code" = "200" ]; then echo "::notice title=smtp::ok"; else echo "::error title=smtp::HTTP $code $(head -c 300 out.json)"; fi
          rm -f out.json

      - name: Deploy functions
        if: steps.chk.outputs.ok == '1'
        run: |
          for f in tg-bot payments notify rates news-sync; do
            if out=$(supabase functions deploy "$f" --project-ref "$PROJECT" --no-verify-jwt --use-api --yes 2>&1); then
              echo "::notice title=deploy $f::ok"
            else
              echo "::error title=deploy $f::$(echo "$out" | tail -8 | tr '\n' ' ')"; exit 1
            fi
          done

      - name: Connect Telegram webhook
        if: steps.chk.outputs.ok == '1' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          SECRET=$(printf 'svoi:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-40)
          curl -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            -d "url=https://$PROJECT.supabase.co/functions/v1/tg-bot" \
            -d "secret_token=$SECRET" -d 'allowed_updates=["message","callback_query"]' > wh.json
          echo "::notice title=webhook::$(head -c 300 wh.json)"
