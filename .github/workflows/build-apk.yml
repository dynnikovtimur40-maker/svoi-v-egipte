name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          mkdir -p lib supabase
          for f in *.dart; do mv "$f" lib/; done
          [ -f schema.sql ] && mv schema.sql supabase/ || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          flutter create . --platforms=android --org com.svoivegipte --project-name svoi_v_egipte
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp assets/icons/android/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png; done
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Свои в Египте"/' $M
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M

      - name: Disable release lint
        run: |
          if [ -f android/build.gradle.kts ]; then
            printf '\ngradle.taskGraph.whenReady { allTasks.filter { it.name.contains("lintVital") }.forEach { it.enabled = false } }\n' >> android/build.gradle.kts
          else
            printf '\ngradle.taskGraph.whenReady { graph -> graph.allTasks.findAll { it.name.contains("lintVital") }.each { it.enabled = false } }\n' >> android/build.gradle
          fi

      - run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib > analyze.txt 2>&1 || true
          cat analyze.txt
          grep -E '^ *error' analyze.txt | head -45 | while IFS= read -r l; do echo "::error::$l"; done
          W=$(grep -cE '^ *warning' analyze.txt || true); I=$(grep -cE '^ *info' analyze.txt || true)
          echo "::notice title=analyze::warnings=$W infos=$I"
          echo "::notice title=warnings::$(grep -E '^ *warning' analyze.txt | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::notice title=infos::$(grep -E '^ *info' analyze.txt | grep -vE 'deprecated_member_use|use_build_context_synchronously|prefer_const|unnecessary_underscores|sort_child' | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          ! grep -qE '^ *error' analyze.txt

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: svoi-v-egipte-apk
          path: build/app/outputs/flutter-apk/app-release.apk
