name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          mkdir -p lib supabase
          for f in main.dart data.dart config.dart; do [ -f "$f" ] && mv "$f" lib/; done
          [ -f schema.sql ] && mv schema.sql supabase/ || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          flutter create . --platforms=android --org com.svoivegipte --project-name svoi_v_egipte
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Свои в Египте"/' $M
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: svoi-v-egipte-apk
          path: build/app/outputs/flutter-apk/app-release.apk
