name: Check secrets
on:
  push:
    paths: ['.github/workflows/check-secrets.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      SB: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Telegram
        run: |
          T=$(printf '%s' "$TG" | tr -d ' \r\n\t')
          case "$T" in 9245461790:*) echo "::notice::token starts correctly, length ${#T}";; *) echo "::error::token does not start with bot id (length ${#T}, prefix ${T:0:3})";; esac
          r=$(curl -s "https://api.telegram.org/bot$T/getMe")
          echo "$r" | grep -q '"ok":true' && echo "::notice::TELEGRAM_BOT_TOKEN OK: $(echo "$r" | grep -o '"username":"[^"]*"')" || echo "::error::TELEGRAM_BOT_TOKEN invalid"
          [ "$ADMIN" = "7984117039" ] && echo "::notice::ADMIN_CHAT_ID OK" || echo "::error::ADMIN_CHAT_ID wrong"
      - name: Supabase
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SB" https://api.supabase.com/v1/projects/pjjeypdxwnbtyqabhroi)
          [ "$code" = "200" ] && echo "::notice::SUPABASE_ACCESS_TOKEN OK" || echo "::error::SUPABASE_ACCESS_TOKEN invalid (HTTP $code)"
