name: Diag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SB: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Webhook
        run: |
          r=$(curl -s "https://api.telegram.org/bot$TG/getWebhookInfo" | python3 -c "import json,sys;d=json.load(sys.stdin)['result'];d.pop('ip_address',None);print(json.dumps(d,ensure_ascii=False))")
          echo "::notice title=webhook::$r"
      - name: Verifications
        run: |
          q="select status, (otp is not null) as has_otp, (tg_chat_id is not null) as has_chat, attempts, to_char(created_at,'MM-DD HH24:MI') c, to_char(updated_at,'MM-DD HH24:MI') u from public.verifications order by id desc limit 8"
          body=$(python3 -c 'import json,sys;print(json.dumps({"query":sys.argv[1]}))' "$q")
          r=$(curl -s -X POST -H "Authorization: Bearer $SB" -H 'Content-Type: application/json' https://api.supabase.com/v1/projects/pjjeypdxwnbtyqabhroi/database/query -d "$body")
          echo "::notice title=verifications::$r"
      - name: Function logs
        run: |
          SQL="select datetime(timestamp) t, m.function_id, r.method, resp.status_code, request.url from function_edge_logs cross join unnest(metadata) as m cross join unnest(m.request) as request cross join unnest(m.response) as resp cross join unnest(m.request) as r where request.url like '%tg-bot%' order by timestamp desc limit 15"
          enc=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$SQL")
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ); from=$(date -u -d '-14 hours' +%Y-%m-%dT%H:%M:%SZ)
          r=$(curl -s -H "Authorization: Bearer $SB" "https://api.supabase.com/v1/projects/pjjeypdxwnbtyqabhroi/analytics/endpoints/logs.all?sql=$enc&iso_timestamp_start=$from&iso_timestamp_end=$now" | head -c 5000)
          echo "::notice title=edge::$(echo "$r" | python3 -c 'import sys,json
d=json.load(sys.stdin)
rows=d.get("result") or []
print(" | ".join(f"{x.get(\"t\")} {x.get(\"method\")} {x.get(\"status_code\")} {str(x.get(\"url\"))[-40:]}" for x in rows) or str(d)[:800])')"
          SQL2="select datetime(timestamp) t, event_message from function_logs where metadata[SAFE_OFFSET(0)].function_id is not null order by timestamp desc limit 15"
          enc=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$SQL2")
          r=$(curl -s -H "Authorization: Bearer $SB" "https://api.supabase.com/v1/projects/pjjeypdxwnbtyqabhroi/analytics/endpoints/logs.all?sql=$enc&iso_timestamp_start=$from&iso_timestamp_end=$now" | head -c 5000)
          echo "::notice title=console::$(echo "$r" | tr '\n' ' ' | head -c 3000)"
