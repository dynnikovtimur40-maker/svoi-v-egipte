name: Diag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SB: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Webhook
        run: |
          r=$(curl -s "https://api.telegram.org/bot$TG/getWebhookInfo" | python3 -c "import json,sys;d=json.load(sys.stdin)['result'];d.pop('ip_address',None);print(json.dumps(d,ensure_ascii=False))")
          echo "::notice title=webhook::$r"
      - name: Verifications
        run: |
          q="select status, (otp is not null) as has_otp, (tg_chat_id is not null) as has_chat, attempts, to_char(created_at,'MM-DD HH24:MI') c, to_char(updated_at,'MM-DD HH24:MI') u from public.verifications order by id desc limit 8"
          body=$(python3 -c 'import json,sys;print(json.dumps({"query":sys.argv[1]}))' "$q")
          r=$(curl -s -X POST -H "Authorization: Bearer $SB" -H 'Content-Type: application/json' https://api.supabase.com/v1/projects/pjjeypdxwnbtyqabhroi/database/query -d "$body")
          echo "::notice title=verifications::$r"
      - name: Function logs
        run: |
          q="select to_char(timestamp,'HH24:MI:SS') t, event_message from function_edge_logs order by timestamp desc limit 1"
          echo skip
