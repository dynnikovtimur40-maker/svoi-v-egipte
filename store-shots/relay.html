<!doctype html><meta charset="utf-8"><title>relay</title>
<script>
(async () => {
  const out = [];
  for (let i = 1; i <= 7; i++) {
    const n = String(i).padStart(2, '0') + '.jpg';
    const b = await (await fetch(n, { cache: 'no-store' })).blob();
    out.push({ name: n, blob: b });
  }
  const t = window.opener || (window.parent !== window ? window.parent : null);
  if (t) t.postMessage({ storeShots: out }, 'https://console.rustore.ru');
  document.body.textContent = 'sent ' + out.length;
})();
</script>
